<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A-Frame AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  font-family: sans-serif;
  background: black;
}

a-scene {
  position: fixed;
  inset: 0;
}

#ui {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  flex-direction: column;
  padding-bottom: 150px;
  background: url("Loading screen.png") center/cover no-repeat;
  z-index: 10;
}

button {
  padding: 14px 28px;
  border-radius: 30px;
  border: none;
  background: white;
  color: black;
  font-size: 16px;
}

#prueba {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 9999;
  color: black;
}
</style>
</head>

<body>

<div id="prueba">Prueba 10</div>

<div id="ui">
  <button id="startBtn">Ver en tu mesa</button>
</div>

<a-scene
  mindar-image="imageTargetSrc: margot_targets.mind; autoStart: true; filterMinCF: 0.0002; filterBeta: 0.004;"
  renderer="alpha: true; physicallyCorrectLights: true; colorManagement: true; exposure: 3.5; toneMapping: ACESFilmicToneMapping;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

<a-assets>
  <a-asset-item id="hdrEnv" src="terrace_sea.hdr"></a-asset-item>
</a-assets>

<a-entity environment-map="src: #hdrEnv; intensity: 4.5"></a-entity>

<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

<a-entity mindar-image-target="targetIndex: 0">
  <a-gltf-model
    src="Plato_01.glb"
    rotation="90 0 0"
    scale="8 8 8">
  </a-gltf-model>
</a-entity>

</a-scene>

<script>
document.getElementById("startBtn").onclick = () => {
  document.getElementById("ui").style.display = "none";
};
</script>

</body>
</html>
