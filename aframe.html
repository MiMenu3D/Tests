<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRUEBA 08</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: sans-serif;
  background: white;
}

/* ESCENA */
a-scene {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
}

/* UI */
#startScreen {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  flex-direction: column;
  padding-bottom: 150px;
  background: url("Loading screen.png") center/cover no-repeat;
  z-index: 9999;
}

button {
  background: white;
  color: black;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 16px;
  border: none;
}

/* DEBUG VISUAL */
#version {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 99999;
  color: black;
}
</style>
</head>

<body>

<div id="version">PRUEBA 08</div>

<div id="startScreen">
  <button id="btnStart">Ver en tu mesa</button>
</div>

<a-scene
  mindar-image="imageTargetSrc: margot_targets.mind; autoStart:true; filterMinCF:0.0002; filterBeta:0.004;"
  renderer="alpha:true; physicallyCorrectLights:true; colorManagement:true; exposure:3.5; toneMapping:ACESFilmicToneMapping;"
  color-space="sRGB"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
>

<a-light type="ambient" intensity="1.5"></a-light>
<a-light type="directional" position="2 4 3" intensity="2.2"></a-light>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0">
  <a-gltf-model
    src="Plato_02.glb"
    rotation="90 0 0"
    scale="8 8 8">
  </a-gltf-model>
</a-entity>

</a-scene>

<script>
let arActive = false;

document.getElementById("btnStart").addEventListener("click", () => {
  document.getElementById("startScreen").style.display = "none";

  if(!arActive){
    history.replaceState({menu:true},"");
    history.pushState({ar:true},"");
    arActive = true;
  }
});

window.addEventListener("popstate", () => {
  arActive = false;
  document.getElementById("startScreen").style.display = "flex";
});
</script>

</body>
</html>
