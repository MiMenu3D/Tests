<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRUEBA 07</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  font-family: sans-serif;
}

a-scene {
  position: fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background: transparent;
}

#startScreen {
  position: fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background: url("Loading screen.png") center/cover no-repeat;
  display:flex;
  flex-direction: column;
  justify-content:flex-end;
  align-items:center;
  gap:12px;
  padding-bottom:150px;
  z-index:10;
}

button {
  background:white;
  color:black;
  padding:14px 28px;
  border-radius:30px;
  font-size:16px;
  border:none;
}

#version {
  position: fixed;
  top:10px;
  left:10px;
  color:black;
  z-index:9999;
}
</style>
</head>

<body>

<div id="version">PRUEBA 07</div>

<div id="startScreen">
  <button id="btnStart">Ver en tu mesa</button>
</div>

<a-scene
  mindar-image="imageTargetSrc: margot_targets.mind; autoStart:true; filterMinCF:0.0002; filterBeta:0.004;"
  renderer="alpha:true; physicallyCorrectLights:true; colorManagement:true; exposure:3.5; toneMapping:ACESFilmicToneMapping;"
  color-space="sRGB"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
>

<a-assets>
  <a-asset-item id="hdrEnv" src="terrace_sea.hdr"></a-asset-item>
</a-assets>

<a-entity environment-map="src:#hdrEnv; intensity:5"></a-entity>

<a-light type="ambient" intensity="1.5"></a-light>
<a-light type="directional" position="2 4 3" intensity="2.2"></a-light>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0">
  <a-gltf-model
    src="Plato_02.glb"
    rotation="90 0 0"
    scale="8 8 8">
  </a-gltf-model>
</a-entity>

</a-scene>

<script>
let arMode = false;

function stopCamera(){
  const video = document.querySelector("video");
  if(video && video.srcObject){
    video.srcObject.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }
}

document.getElementById("btnStart").onclick = () => {
  document.getElementById("startScreen").style.display = "none";

  if(!arMode){
    history.replaceState({menu:true},"");
    history.pushState({ar:true},"");
    arMode = true;
  }
};

window.addEventListener("popstate", function(){
  arMode = false;
  stopCamera();
  document.getElementById("startScreen").style.display = "flex";
});
</script>

</body>
</html>
