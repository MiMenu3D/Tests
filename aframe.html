<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A-Frame Fallback</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  font-family: sans-serif;
}

/* ESCENA */
a-scene {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: black;
}

/* LOADING SCREEN */
#startScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: url("Loading screen.png") center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: 120px;
  z-index: 9999;
}

/* BOTÓN */
.button {
  background: white;
  color: black;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 16px;
  border: none;
}
</style>
</head>

<body>

<!-- 🔴 UI INICIAL -->
<div id="startScreen">
  <button class="button" onclick="startAR()">Ver en tu mesa</button>
</div>

<!-- 🔵 ESCENA A-FRAME -->
<a-scene
  id="scene"
  embedded
  mindar-image="imageTargetSrc: margot_targets.mind; autoStart:false; filterMinCF:0.0002; filterBeta:0.004;"
  renderer="alpha:true; physicallyCorrectLights:true; colorManagement:true;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
>

  <!-- LUCES -->
  <a-light type="ambient" intensity="1.3"></a-light>
  <a-light type="directional" position="2 4 3" intensity="1.8"></a-light>

  <!-- CÁMARA -->
  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <!-- TARGET -->
  <a-entity mindar-image-target="targetIndex:0">
    <a-gltf-model
      src="Plato_02.glb"
      rotation="90 0 0"
      scale="8 8 8">
    </a-gltf-model>
  </a-entity>

</a-scene>

<script>
let started = false;

function startAR() {
  if (started) return;
  started = true;

  // ocultar UI
  document.getElementById("startScreen").style.display = "none";

  const scene = document.querySelector("a-scene");

  // esperar carga completa de A-Frame
  if (scene.hasLoaded) {
    launch();
  } else {
    scene.addEventListener("loaded", launch);
  }

  function launch() {
    setTimeout(() => {
      try {
        const system = scene.systems["mindar-image-system"];
        if (system) system.start();
      } catch (e) {
        console.warn("MindAR error:", e);
      }
    }, 800);
  }
}
</script>

</body>
</html>
