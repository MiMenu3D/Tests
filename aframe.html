<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A-Frame Fallback</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  background: black;
}
</style>
</head>

<body>

<a-scene
  embedded
  mindar-image="imageTargetSrc: margot_targets.mind; autoStart:false; filterMinCF:0.0002; filterBeta:0.004;"
  renderer="alpha:true; physicallyCorrectLights:true; colorManagement:true;"
  color-space="sRGB"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
>

  <!-- Luces (mínimas pero suficientes) -->
  <a-light type="ambient" intensity="1.3"></a-light>
  <a-light type="directional" position="2 4 3" intensity="1.8"></a-light>

  <!-- Cámara -->
  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <!-- Target -->
  <a-entity mindar-image-target="targetIndex:0">
    <a-gltf-model
      src="Plato_02.glb"
      rotation="90 0 0"
      scale="8 8 8">
    </a-gltf-model>
  </a-entity>

</a-scene>

<!-- CONTROL DE INICIO SEGURO -->
<script>
let started = false;

function startMindARSafe() {
  if (started) return;
  started = true;

  const scene = document.querySelector("a-scene");

  if (!scene) return;

  // Esperar a que A-Frame esté realmente listo
  if (scene.hasLoaded) {
    launch();
  } else {
    scene.addEventListener("loaded", launch);
  }

  function launch() {
    setTimeout(() => {
      try {
        const system = scene.systems["mindar-image-system"];
        if (system) {
          system.start();
        }
      } catch (e) {
        console.warn("MindAR start error:", e);
      }
    }, 1200);
  }
}

// Arranque controlado (NO inmediato)
window.addEventListener("load", () => {
  setTimeout(startMindARSafe, 1000);
});
</script>

</body>
</html>
