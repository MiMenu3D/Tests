<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A-Frame AR</title>

<!-- Head original v39: Solo el núcleo gráfico nativo para el menú principal -->
<script src="https://aframe.io"></script>
<script type="module" src="https://unpkg.com"></script>

<style>

#prueba {
  font-size: 22px;
  color: white;
  text-shadow: 0 0 10px black;
  margin-bottom: 12px;
}
  
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  background: #1f1a17;
}

/* ===== MODEL VIEWER ===== */

#mvContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 40%;
  background: #1f1a17;
  z-index: 40;
}

model-viewer {
  width: 100%;
  height: 100%;
  background: transparent;
  filter: saturate(0.87) contrast(0.88);
  opacity: 0;
  transition: opacity 0.5s ease;
}

#startScreen {
  position: fixed;
  top: 40%;
  left: 0;
  right: 0;
  bottom: 0;
  background: url("Loading screen.png") center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: 20%;
  z-index: 30;
}

.arrowContainer {
  display: flex;
  gap: 20px;
  margin-bottom: 10px;
}

.arrow {
  font-size: 28px;
  padding: 10px 16px;
  background: rgba(255,255,255,0.9);
  border-radius: 12px;
  border: none;
}

.button {
  background: white;
  color: black;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 16px;
  border: none;
}

/* ===== AR ===== */

#arContainer {
  position: fixed;
  inset: 0;
  background: #1f1a17;
  z-index: 50;
  display: none;
}

a-scene {
  width: 100%;
  height: 100%;
}
  
</style>
</head>

<body>

<div id="mvContainer"></div>

<div id="startScreen">
  <!-- Forzado manualmente a Prueba 49 -->
  <div id="prueba">Prueba 49</div>
  <div id="label">Plato 01</div>

  <div class="arrowContainer">
    <button class="arrow" onclick="prev()">←</button>
    <button class="arrow" onclick="next()">→</button>
  </div>

  <button class="button" onclick="startAR()">Ver en tu mesa</button>
</div>

<div id="arContainer"></div>

<script>

let current = 0;
let mv = null;

/* MODELOS */
const models = [
  "Plato_01.glb","Plato_02.glb","Plato_03.glb","Plato_04.glb",
  "Plato_05.glb","Plato_06.glb","Plato_07.glb","Plato_08.glb",
  "Plato_09.glb","Plato_10.glb","Plato_11.glb","Plato_12.glb",
  "Plato_13.glb","Plato_14.glb","Plato_15.glb"
];

/* ===== MODEL VIEWER ===== */

function createMV(){

  const container = document.getElementById("mvContainer");

  container.innerHTML = `
    <model-viewer
      id="mv"
      src="${models[current]}"
      autoplay
      auto-rotate
      auto-rotate-delay="0"
      rotation-per-second="17deg"
      camera-orbit="0deg 70deg 45%"
      min-camera-orbit="0deg 0deg 45%"
      max-camera-orbit="360deg 90deg 45%"
      camera-controls="false"
      touch-action="none"
      disable-pan
      disable-zoom
      interaction-prompt="none"
      shadow-intensity="0.5"
      exposure="0.80"
      style="background-color:#1f1a17;"
    ></model-viewer>
  `;

  mv = document.getElementById("mv");

  /* Fade inicial */
  mv.addEventListener("load", () => {
    mv.style.opacity = "1";
  }, { once: true });

  document.getElementById("label").innerText =
    "Plato " + (current + 1);
}

/* Fade entre modelos */
function updateMV(){
  if (!mv) return;

  mv.style.opacity = "0";
  mv.setAttribute("src", models[current]);

  mv.addEventListener("load", () => {
    mv.style.opacity = "1";
  }, { once: true });

  document.getElementById("label").innerText =
    "Plato " + (current + 1);
}

function destroyMV(){
  document.getElementById("mvContainer").innerHTML = "";
  mv = null;
}

/* ===== AR ===== */

// Carga asíncrona local: Inyecta xr.js y xrextras.js locales sin pisar a model-viewer en el arranque
function loadLocal8thWall(callback) {
  if (window.XR8) {
    callback();
    return;
  }
  const s1 = document.createElement("script");
  s1.src = "./xr.js"; // Llama al archivo de tu primer pantallazo
  s1.onload = () => {
    const s2 = document.createElement("script");
    s2.src = "./xrextras.js"; // Llama al xrextras local de tu repositorio
    s2.onload = callback;
    document.head.appendChild(s2);
  };
  document.head.appendChild(s1);
}

function createAR(){
  loadLocal8thWall(() => {
    const container = document.getElementById("arContainer");

    container.innerHTML = `
      <a-scene
        xrweb="disableWorldTracking: true; imageTargetSmoothing: 0.6;"
        xrextras-loading
        xrextras-runtime-error
        renderer="alpha: true; 
        physicallyCorrectLights: true; 
        colorManagement: true; 
        exposure: 3.5; 
        toneMapping: ACESFilmicToneMapping;"
        color-space="sRGB"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
      >

      <a-assets>
        <a-asset-item id="hdrEnv" src="terrace_sea.hdr"></a-asset-item>
      </a-assets>

      

      <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

      <!-- Target de 8th Wall apuntando a tu Cupcake (Marker_8th_01) -->
      <xrextras-named-image-target name="Marker_8th_01">
        <a-gltf-model
          id="aframeModel"
          src="${models[current]}"
          rotation="90 0 0"
          scale="8 8 8">
        </a-gltf-model>
      </xrextras-named-image-target>

    </a-scene>
    `;
  });
}

function destroyAR(){
  // Apagado violento del hardware de la cámara al volver atrás
  if (window.XR8) {
    try { XR8.stop(); } catch(e) {}
  }
  document.getElementById("arContainer").innerHTML = "";
}

/* ===== CONTROLES ===== */

function prev(){
  current = (current - 1 + models.length) % models.length;
  updateMV();
}

function next(){
  current = (current + 1) % models.length;
  updateMV();
}

/* ===== TRANSICIONES ===== */

function startAR(){

  history.pushState({ mode: "ar", current }, "");

  destroyMV();

  document.getElementById("startScreen").style.display = "none";

  const arContainer = document.getElementById("arContainer");
  arContainer.style.display = "block";

  createAR();
}

function stopAR(){

  destroyAR();

  document.getElementById("arContainer").style.display = "none";

  document.getElementById("startScreen").style.display = "flex";

  createMV();
}

/* BACK */
window.addEventListener("popstate", () => {
  stopAR();
});

/* INIT */
createMV();

</script>

</body>
</html>
