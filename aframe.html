<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A-Frame AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin:0;
  padding:0;
  overflow:hidden;
  width:100vw;
  height:100vh;
  background:black;
}

a-scene{
  position:fixed;
  inset:0;
}

#ui{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:120px;
  background:url("Loading screen.png") center/cover no-repeat;
  z-index:10;
}

button{
  padding:14px 28px;
  border-radius:30px;
  border:none;
  background:white;
}
</style>
</head>

<body>

<div id="ui">
  <button id="startBtn">Ver en tu mesa</button>
</div>

<a-scene
  id="scene"
  renderer="alpha:true"
  mindar-image="imageTargetSrc: margot_targets.mind; autoStart:true; filterMinCF:0.0002; filterBeta:0.004;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
>

<a-entity mindar-image-target="targetIndex:0">
  <a-gltf-model src="Plato_01.glb" scale="8 8 8"></a-gltf-model>
</a-entity>

</a-scene>

<script>

let started=false;

function enterAR(){

  if(started) return;
  started=true;

  // 🔥 FIX BACK BUTTON REAL
  history.replaceState({menu:true}, "");
  history.pushState({ar:true}, "");

  document.getElementById("ui").style.display="none";

  const scene = document.querySelector("a-scene");

  const system = scene.systems["mindar-image-system"];
  if(system && system.start){
    system.start();
  }
}

// BACK FIX
window.addEventListener("popstate", (e)=>{
  document.getElementById("ui").style.display="flex";
  started=false;
});

document.getElementById("startBtn").onclick = enterAR;

</script>

</body>
</html>
