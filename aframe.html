<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A-Frame AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

#prueba {
  font-size: 22px;
  color: white;
  text-shadow: 0 0 10px black;
  margin-bottom: 12px;
}
  
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  background: transparent;
}

a-scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

button {
  padding: 14px 28px;
  border-radius: 30px;
  border: none;
  background: white;
  color: black;
  font-size: 16px;
}

.arrowContainer {
  display: flex;
  gap: 20px;
  margin-bottom: 10px;
}

.arrow {
  font-size: 28px;
  padding: 10px 16px;
  background: rgba(255,255,255,0.9);
  color: black;
  border-radius: 12px;
  border: none;
}

.button {
  background: white;
  color: black;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 16px;
  border: none;
}

  
#selector {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 10px;
  color: white;
}

#selector button {
  background: white;
  border: none;
  padding: 10px 14px;
  border-radius: 10px;
  color: black;
}

/* ===== MODEL VIEWER ===== */

#mvContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 40%;
  background: #1f1a17;
  display: block;
  z-index: 40;
}

model-viewer {
  width: 100%;
  height: 100%;
  background: transparent;
  filter: saturate(0.87) contrast(0.88);
}

#startScreen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  flex-direction: column;
  padding-bottom: 150px;
  background: url("Loading screen.png") center/cover no-repeat;
}
  
</style>
</head>

<body>
<div id="startScreen">

  <div id="modelTitle">Plato 01</div>









  
  <div id="prueba">Prueba 16</div>






  <div id="label">Plato 01</div>

  <div class="arrowContainer">
    <button class="arrow" onclick="prev()">←</button>
    <button class="arrow" onclick="next()">→</button>
  </div>

  <button class="button" id="startBtn">Ver en tu mesa</button>

</div>

<div id="mvContainer">
<model-viewer
  id="mv"
  src="Plato_01.glb"
  autoplay
  auto-rotate
  auto-rotate-delay="0"
  rotation-per-second="17deg"
  camera-orbit="0deg 70deg 45%"
  min-camera-orbit="0deg 0deg 45%"
  max-camera-orbit="360deg 90deg 45%"
  camera-controls="false"
  touch-action="none"
  disable-pan
  disable-zoom
  interaction-prompt="none"
  shadow-intensity="0.5"
  exposure="0.80"
  style="background-color:#1f1a17;"
></model-viewer>
</div>


<a-scene
  renderer="alpha:true; antialias:true; colorManagement:true;"
  mindar-image="imageTargetSrc: margot_targets.mind; autoStart:true; filterMinCF:0.0002; filterBeta:0.004;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
>

<a-assets>
  <a-asset-item id="hdrEnv" src="terrace_sea.hdr"></a-asset-item>
</a-assets>

<a-entity environment-map="src:#hdrEnv; intensity:4.5"></a-entity>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0">
  <a-gltf-model
    id="model"
    src="Plato_01.glb"
    rotation="90 0 0"
    scale="8 8 8">
  </a-gltf-model>
</a-entity>

</a-scene>

<script>

let current = 0;

/* MODELS */
const models = [
  "Plato_01.glb","Plato_02.glb","Plato_03.glb","Plato_04.glb",
  "Plato_05.glb","Plato_06.glb","Plato_07.glb","Plato_08.glb",
  "Plato_09.glb","Plato_10.glb","Plato_11.glb","Plato_12.glb",
  "Plato_13.glb","Plato_14.glb","Plato_15.glb"
];

/* MODEL-VIEWER */
function updateMV(){
  const mv = document.getElementById("mv");
  if (!mv) return;

  mv.style.opacity = "0";
  mv.setAttribute("src", models[current]);

  mv.addEventListener("load", () => {
    mv.style.transition = "opacity 0.4s ease";
    mv.style.opacity = "1";
  }, { once: true });

  document.getElementById("label").innerText =
    "Plato " + (current + 1);
}

/* A-FRAME */
function updateAR(){
  const arModel = document.getElementById("model");
  if (!arModel) return;

  arModel.setAttribute("src", models[current]);
}

/* MASTER */
function updateAll(){
  updateMV();
  updateAR();
}

/* CONTROLS */
function prev(){
  current = (current - 1 + models.length) % models.length;
  updateAll();
}

function next(){
  current = (current + 1) % models.length;
  updateAll();
}

/* START */
document.getElementById("startBtn").onclick = () => {

  document.getElementById("startScreen").style.display = "none";

  const scene = document.querySelector("a-scene");

  if (scene && scene.components["mindar-image-system"]) {
    scene.components["mindar-image-system"].start();
  }

};
  
/* INIT */
updateAll();


</script>

</body>
</html>
