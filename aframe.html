<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A-Frame AR v42</title>

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- 8th Wall XR (wrapper + image tracking) -->
<script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

<!-- Model viewer UI arriba -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  background: #1f1a17;
}

#mvContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 40%;
  z-index: 40;
}

model-viewer {
  width: 100%;
  height: 100%;
  background: transparent;
  filter: saturate(0.87) contrast(0.88);
}

#startScreen {
  position: fixed;
  top: 40%;
  left: 0;
  right: 0;
  bottom: 0;
  background: url("Loading screen.png") center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: 20%;
  z-index: 30;
}

.button {
  background: white;
  color: black;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 16px;
  border: none;
}

#arContainer {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 50;
}

</style>
</head>

<body>

<div id="mvContainer"></div>

<div id="startScreen">
  <div id="prueba">Prueba 42</div>
  <button class="button" onclick="startAR()">Ver en tu mesa</button>
</div>

<div id="arContainer"></div>

<script>

let current = 0;

const models = [
  "Plato_01.glb","Plato_02.glb","Plato_03.glb","Plato_04.glb",
  "Plato_05.glb","Plato_06.glb","Plato_07.glb","Plato_08.glb",
  "Plato_09.glb","Plato_10.glb","Plato_11.glb","Plato_12.glb",
  "Plato_13.glb","Plato_14.glb","Plato_15.glb"
];

function createAR() {

  const container = document.getElementById("arContainer");

  container.innerHTML = `
    <a-scene
      id="scene"
      xrweb="allowedDevices: any"
      renderer="alpha: true; colorManagement: true;"
    >

      <!-- TARGET IMAGE TRACKING -->
      <a-assets>
        <img id="marker" src="Marker_8th_01.jpg">
      </a-assets>

      <!-- IMAGE TRACKER ANCHOR -->
      <a-entity xrextras-named-image-target="name: marker">

        <a-gltf-model
          id="model"
          src="${models[current]}"
          rotation="90 0 0"
          scale="8 8 8">
        </a-gltf-model>

      </a-entity>

    </a-scene>
  `;
}

function startAR() {

  document.getElementById("startScreen").style.display = "none";
  document.getElementById("arContainer").style.display = "block";

  createAR();
}

</script>

</body>
</html>
