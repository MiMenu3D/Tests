<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A-Frame Safe</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  background: black;
  font-family: sans-serif;
}

/* UI SIEMPRE VISIBLE */
#ui {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  padding-bottom: 120px;
  z-index: 9999;
  background: url("Loading screen.png") center/cover no-repeat;
}

button {
  background: white;
  color: black;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 16px;
  border: none;
}
</style>
</head>

<body>

<!-- UI -->
<div style="position:fixed;top:10px;left:10px;color:white;z-index:99999;">
PRUEBA v1
</div>
<div id="ui">
  <button id="startBtn">Ver en tu mesa</button>
</div>

<!-- ESCENA -->
<a-scene
  id="scene"
  embedded
  mindar-image="imageTargetSrc: margot_targets.mind; autoStart:false; filterMinCF:0.0002; filterBeta:0.004;"
  renderer="alpha:true; physicallyCorrectLights:true; colorManagement:true;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
>

  <a-light type="ambient" intensity="1.3"></a-light>
  <a-light type="directional" position="2 4 3" intensity="1.8"></a-light>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex:0">
    <a-gltf-model
      src="Plato_02.glb"
      rotation="90 0 0"
      scale="8 8 8">
    </a-gltf-model>
  </a-entity>

</a-scene>

<script>
let started = false;

document.getElementById("startBtn").addEventListener("click", () => {
  if (started) return;
  started = true;

  document.getElementById("ui").style.display = "none";

  const scene = document.querySelector("a-scene");

  const tryStart = () => {
    const system = scene.systems["mindar-image-system"];

    if (system && system.start) {
      system.start();
      console.log("MindAR STARTED");
    } else {
      console.log("MindAR not ready, retry...");
      setTimeout(tryStart, 300);
    }
  };

  tryStart();
});
</script>

</body>
</html>
