<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A-Frame PRUEBA 03</title>

<!-- Anti-caché -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js?v=3"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  background: black;
  font-family: sans-serif;
}

/* Indicador de versión */
#version {
  position: fixed;
  top: 10px;
  left: 10px;
  color: white;
  z-index: 99999;
  font-size: 14px;
}

/* UI */
#ui {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  padding-bottom: 120px;
  z-index: 9999;
  background: url("Loading screen.png") center/cover no-repeat;
}

button {
  background: white;
  color: black;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 16px;
  border: none;
}
</style>
</head>

<body>

<div id="version">PRUEBA 03</div>

<div id="ui">
  <button id="startBtn">Ver en tu mesa</button>
</div>

<a-scene
  id="scene"
  embedded
  mindar-image="imageTargetSrc: margot_targets.mind; autoStart:false; filterMinCF:0.0002; filterBeta:0.004;"
  renderer="alpha:true; physicallyCorrectLights:true; colorManagement:true; exposure:3.5; toneMapping:ACESFilmicToneMapping;"
  color-space="sRGB"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
>

  <!-- ASSETS -->
  <a-assets>
    <a-asset-item id="hdrEnv" src="terrace_sea.hdr"></a-asset-item>
  </a-assets>

  <!-- ILUMINACIÓN -->
  <a-entity environment-map="src:#hdrEnv; intensity:5"></a-entity>
  <a-light type="ambient" intensity="1.5"></a-light>
  <a-light type="directional" position="2 4 3" intensity="2.2"></a-light>

  <!-- CÁMARA -->
  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <!-- TARGET + MODELO -->
  <a-entity mindar-image-target="targetIndex:0">
    <a-gltf-model
      src="Plato_02.glb"
      rotation="90 0 0"
      scale="8 8 8">
    </a-gltf-model>
  </a-entity>

</a-scene>

<script>
let started = false;

document.getElementById("startBtn").addEventListener("click", () => {
  if (started) return;
  started = true;

  document.getElementById("ui").style.display = "none";

  const scene = document.querySelector("a-scene");

  const tryStart = () => {
    const system = scene.systems["mindar-image-system"];

    if (system && system.start) {
      system.start();
      console.log("MindAR STARTED");
    } else {
      setTimeout(tryStart, 300);
    }
  };

  tryStart();
});
</script>

</body>
</html>
