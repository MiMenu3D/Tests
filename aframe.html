<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A-Frame AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  background: transparent;
}

a-scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

#ui {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  flex-direction: column;
  padding-bottom: 150px;
  background: url("Loading screen.png") center/cover no-repeat;
  z-index: 10;
}

button {
  padding: 14px 28px;
  border-radius: 30px;
  border: none;
  background: white;
  color: black;
  font-size: 16px;
}

#selector {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 10px;
  color: white;
}

#selector button {
  background: white;
  border: none;
  padding: 10px 14px;
  border-radius: 10px;
  color: black;
}
</style>
</head>

<body>

<div style="position:fixed;top:10px;left:10px;color:black;z-index:99999;">
Prueba 12
</div>

<div id="ui">
  <button id="startBtn">Ver en tu mesa</button>
</div>

<div id="selector">
  <button onclick="prev()">←</button>
  <span id="label">Plato 01</span>
  <button onclick="next()">→</button>
</div>

<a-scene
  renderer="alpha:true; antialias:true; colorManagement:true;"
  mindar-image="imageTargetSrc: margot_targets.mind; autoStart:true; filterMinCF:0.0002; filterBeta:0.004;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
>

<a-assets>
  <a-asset-item id="hdrEnv" src="terrace_sea.hdr"></a-asset-item>
</a-assets>

<a-entity environment-map="src:#hdrEnv; intensity:4.5"></a-entity>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0">
  <a-gltf-model
    id="model"
    src="Plato_01.glb"
    rotation="90 0 0"
    scale="8 8 8">
  </a-gltf-model>
</a-entity>

</a-scene>

<script>

const models = [
  "Plato_01.glb","Plato_02.glb","Plato_03.glb","Plato_04.glb",
  "Plato_05.glb","Plato_06.glb","Plato_07.glb","Plato_08.glb",
  "Plato_09.glb","Plato_10.glb","Plato_11.glb","Plato_12.glb",
  "Plato_13.glb","Plato_14.glb","Plato_15.glb"
];

let current = 0;

function update(){
  document.getElementById("model").setAttribute("src", models[current]);
  document.getElementById("label").innerText = "Plato " + (current+1);
}

function prev(){
  current = (current - 1 + models.length) % models.length;
  update();
}

function next(){
  current = (current + 1) % models.length;
  update();
}

document.getElementById("startBtn").onclick = () => {
  document.getElementById("ui").style.display = "none";
};

update();

</script>

</body>
</html>
