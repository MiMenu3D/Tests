<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Test AR</title>

<script src="https://aframe.io"></script>
<script src="https://jsdelivr.net"></script>
<script type="module" src="https://unpkg.com"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: sans-serif;
}

a-scene {
  position: fixed;
  inset: 0;
  background: transparent;
}

#mvContainer {
  position: fixed;
  inset: 0;
  background: #f2f2f2;
  display: none;
  z-index: 20;
}

model-viewer {
  width: 100%;
  height: 100%;
  background: #f2f2f2;
}

#startScreen {
  position: fixed;
  inset: 0;
  background: url("Loading screen.png") center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: 20%;
  z-index: 30;
}

#modelTitle {
  font-size: 22px;
  margin-bottom: 12px;
  text-shadow: 0 0 10px black;
  color: white;
}

.arrowContainer {
  display: flex;
  gap: 20px;
  margin-bottom: 10px;
}

.arrow {
  font-size: 28px;
  padding: 10px 16px;
  background: rgba(255,255,255,0.9);
  color: black;
  border-radius: 12px;
  border: none;
}

.button {
  background: white;
  color: black;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 16px;
  border: none;
  margin: 6px;
}
</style>
</head>

<body>

<!-- Cambio quirúrgico: autoStart: true para que no se cuelgue, pero uiLoading: no para que no se vea hasta pulsar el botón -->
<a-scene
  mindar-image="imageTargetSrc: margot_targets.mind; autoStart: true; uiLoading: no; filterMinCF: 0.0002; filterBeta: 0.004;"
  renderer="alpha: true; physicallyCorrectLights: true; colorManagement: true; exposure: 3.5; toneMapping: ACESFilmicToneMapping;"
  color-space="sRGB"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

<a-assets>
  <a-asset-item id="hdrEnv" src="terrace_sea.hdr"></a-asset-item>
</a-assets>



<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>


  <a-gltf-model
    id="aframeModel"
    src="Plato_01.glb"
    rotation="90 0 0"
    scale="8 8 8">
  </a-gltf-model>


</a-scene>

<div id="mvContainer">
  <model-viewer
    id="mv"
    src="Plato_01.glb"
    ar
    ar-modes="webxr"
    camera-controls
    shadow-intensity="0"
    exposure="1"
    occlusion="false">
  </model-viewer>
</div>

<div id="startScreen">
  <div id="modelTitle">Plato 01</div>

  <div class="arrowContainer">
    <button class="arrow" onclick="prev()">← </button>
    <button class="arrow" onclick="next()">→</button>
  </div>

  <button class="button" onclick="enterSceneViewer()">Scene Viewer</button>
  <button class="button" onclick="enterAFrame()">A-Frame</button>
  <button class="button" onclick="enterModelViewer()">model-viewer</button>
  <button class="button" onclick="enterWebXR()">WebXR</button>
</div>

<script>

const models = [
  { name:"Plato 01", file:"Plato_01.glb" },
  { name:"Plato 02", file:"Plato_02.glb" }
];

let current = 0;
let arMode = false;

function activateARState() {
  if (!arMode) {
    history.replaceState({menu:true}, "");
    history.pushState({ar:true}, "");
    arMode = true;
  }
}

function absoluteModelURL(file){
  return window.location.origin + window.location.pathname.replace(/[^/]*$/, '') + file;
}

function updateUI(){
  document.getElementById("modelTitle").innerText = models[current].name;
  document.getElementById("aframeModel").setAttribute("src", models[current].file);
  document.getElementById("mv").setAttribute("src", models[current].file);
}

function prev(){
  current = (current - 1 + models.length) % models.length;
  updateUI();
}

function next(){
  current = (current + 1) % models.length;
  updateUI();
}

function enterAFrame(){
  activateARState();
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("mvContainer").style.display = "none";
}

function enterModelViewer(){
  activateARState();
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("mvContainer").style.display = "block";
}

function enterWebXR(){
  activateARState();

  const mv = document.getElementById("mv");

  document.getElementById("startScreen").style.display = "none";
  document.getElementById("mvContainer").style.display = "block";

  mv.setAttribute("ar-modes","webxr");

  setTimeout(()=>{
    mv.activateAR();
  },300);
}

function enterSceneViewer(){
  activateARState();

  const modelURL = absoluteModelURL(models[current].file);
  const fallbackURL = window.location.href;

  const intent =
    `intent://://google.com{encodeURIComponent(modelURL)}&mode=ar_preferred&resizable=false&disable_occlusion=true#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(fallbackURL)};end;`;

  window.location.href = intent;
}

window.addEventListener("popstate", function(){
  arMode = false;
  document.getElementById("mvContainer").style.display = "none";
  document.getElementById("startScreen").style.display = "flex";
});

updateUI();

</script>

</body>
</html>
