<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Test AR</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
html, body {
  margin:0;
  padding:0;
  overflow:hidden;
  font-family:sans-serif;
}

#mvContainer{
  position:fixed;
  inset:0;
  display:none;
  z-index:20;
  background: linear-gradient(180deg, #d6dbe0, #f3efe8);
}

model-viewer{
  width:100%;
  height:100%;
  background: transparent;
}

#startScreen{
  position:fixed;
  inset:0;
  background:url("Loading screen.png") center/cover no-repeat;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  padding-bottom:20%;
  z-index:30;
}

.button{
  background:white;
  border:none;
  padding:14px 28px;
  border-radius:30px;
}
</style>
</head>

<body>

<div id="startScreen">
  <button class="button" onclick="openViewer()">Ver en tu mesa</button>
</div>

<div id="mvContainer">
  <model-viewer
    id="mv"
    src="Plato_01.glb"
    camera-controls
    disable-zoom
    exposure="1"
    shadow-intensity="0"
  ></model-viewer>
</div>

<script>

let current = 0;

const models = [
 "Plato_01.glb","Plato_02.glb","Plato_03.glb","Plato_04.glb",
 "Plato_05.glb","Plato_06.glb","Plato_07.glb","Plato_08.glb",
 "Plato_09.glb","Plato_10.glb","Plato_11.glb","Plato_12.glb",
 "Plato_13.glb","Plato_14.glb","Plato_15.glb"
];

function getURL(file){
  return location.origin + location.pathname.replace(/[^/]*$/,'') + file;
}

function openViewer(){
  const file = getURL(models[current]);

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

  if(isIOS){
    window.location.href = file.replace(".glb",".usdz");
    return;
  }

  const intent =
`intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(file)}&mode=ar_preferred&disable_fusion=true&scale=fixed#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end;`;

  window.location.href = intent;
}

</script>

</body>
</html>
