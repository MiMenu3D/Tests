<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Test AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<script src="https://cdn.rawgit.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: sans-serif;
}

a-scene, #arjsScene {
  position: fixed;
  inset: 0;
  background: transparent;
}

#mvContainer {
  position: fixed;
  inset: 0;
  background: #f2f2f2;
  display: none;
  z-index: 20;
}

model-viewer {
  width: 100%;
  height: 100%;
  background: #f2f2f2;
}

#startScreen {
  position: fixed;
  inset: 0;
  background: url("Loading screen.png") center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: 20%;
  z-index: 30;
}

#modelTitle {
  font-size: 22px;
  margin-bottom: 12px;
  text-shadow: 0 0 10px black;
  color: white;
}

.arrowContainer {
  display: flex;
  gap: 20px;
  margin-bottom: 10px;
}

.arrow {
  font-size: 28px;
  padding: 10px 16px;
  background: rgba(255,255,255,0.9);
  color: black;
  border-radius: 12px;
  border: none;
}

.button {
  background: white;
  color: black;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 16px;
  border: none;
  margin: 6px;
}
</style>
</head>

<body>

<!-- MindAR A-Frame -->
<a-scene
  id="scene"
  mindar-image="imageTargetSrc: margot_targets.mind; autoStart: true; filterMinCF: 0.0002; filterBeta: 0.004;"
  renderer="alpha: true; physicallyCorrectLights: true; colorManagement: true; exposure: 3.5; toneMapping: ACESFilmicToneMapping;"
  color-space="sRGB"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
<a-assets>
  <a-asset-item id="hdrEnv" src="terrace_sea.hdr"></a-asset-item>
</a-assets>

<a-entity environment-map="src: #hdrEnv; intensity: 4.5"></a-entity>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

<a-entity mindar-image-target="targetIndex: 0">
  <a-gltf-model
    id="aframeModel"
    src="Plato_01.glb"
    rotation="90 0 0"
    scale="8 8 8">
  </a-gltf-model>
</a-entity>

</a-scene>

<!-- AR.js A-Frame -->
<a-scene
  id="arjsScene"
  embedded
  arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  style="display:none;"
>
  <a-marker type="pattern" url="marker.patt">
    <a-entity id="arjsModel" rotation="0 0 0" scale="0.08 0.08 0.08"></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<!-- Model-viewer -->
<div id="mvContainer">
  <model-viewer
    id="mv"
    src="Plato_01.glb"
    ar
    ar-modes="scene-viewer"
    camera-controls
    shadow-intensity="0"
    exposure="1"
    occlusion="false">
  </model-viewer>
</div>

<!-- Menú principal -->
<div id="startScreen">
  <div id="modelTitle">Plato 01</div>

  <div class="arrowContainer">
    <button class="arrow" onclick="prev()">←</button>
    <button class="arrow" onclick="next()">→</button>
  </div>

  <button class="button" onclick="enterSceneViewer()">Scene Viewer</button>
  <button class="button" onclick="enterAFrame()">A-Frame</button>
  <button class="button" onclick="enterModelViewer()">model-viewer</button>
  <button class="button" onclick="enterARjs()">AR.js</button>
</div>

<script>
const models = [
  { name:"Plato 01", file:"Plato_01.glb" },
  { name:"Plato 02", file:"Plato_02.glb" },
  { name:"Plato 03", file:"Plato_03.glb" },
  { name:"Plato 04", file:"Plato_04.glb" },
  { name:"Plato 05", file:"Plato_05.glb" },
  { name:"Plato 06", file:"Plato_06.glb" },
  { name:"Plato 07", file:"Plato_07.glb" },
  { name:"Plato 08", file:"Plato_08.glb" },
  { name:"Plato 09", file:"Plato_09.glb" },
  { name:"Plato 10", file:"Plato_10.glb" },
  { name:"Plato 11", file:"Plato_11.glb" },
  { name:"Plato 12", file:"Plato_12.glb" },
  { name:"Plato 13", file:"Plato_13.glb" },
  { name:"Plato 14", file:"Plato_14.glb" },
  { name:"Plato 15", file:"Plato_15.glb" }
];

let current = 0;
let arMode = false;

function activateARState() {
  if (!arMode) {
    history.replaceState({menu:true}, "");
    history.pushState({ar:true}, "");
    arMode = true;
  }
}

function absoluteModelURL(file){
  return window.location.origin + window.location.pathname.replace(/[^/]*$/, '') + file;
}

function updateUI(){
  document.getElementById("modelTitle").innerText = models[current].name;
  document.getElementById("aframeModel").setAttribute("src", models[current].file);
  document.getElementById("mv").setAttribute("src", models[current].file);
  const arjsModel = document.getElementById("arjsModel");
  if(arjsModel) arjsModel.setAttribute("gltf-model", models[current].file);
}

function prev(){
  current = (current - 1 + models.length) % models.length;
  updateUI();
}

function next(){
  current = (current + 1) % models.length;
  updateUI();
}

// 🔥 Fix A-frame MindAR
function enterAFrame(){
  activateARState();
  const sceneEl = document.querySelector("#scene");
  const mindarSystem = sceneEl.systems["mindar-image-system"];
  if (mindarSystem) {
    mindarSystem.stop();
    setTimeout(() => {
      mindarSystem.start();
    }, 50);
  }
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("mvContainer").style.display = "none";
  document.getElementById("arjsScene").style.display = "none";
}

// Model-viewer
function enterModelViewer(){
  activateARState();
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("mvContainer").style.display = "block";
  document.getElementById("arjsScene").style.display = "none";
}

// Scene Viewer
function enterSceneViewer(){
  activateARState();
  const modelURL = absoluteModelURL(models[current].file);
  const fallbackURL = window.location.href;
  const intent =
    `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(modelURL)}&mode=ar_preferred&resizable=false&disable_occlusion=true#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(fallbackURL)};end;`;
  window.location.href = intent;
  document.getElementById("arjsScene").style.display = "none";
}

// 🔹 Nuevo: AR.js
function enterARjs(){
  activateARState();
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("mvContainer").style.display = "none";
  document.getElementById("arjsScene").style.display = "block";
  updateUI();
}

window.addEventListener("popstate", function(){
  arMode = false;
  document.getElementById("mvContainer").style.display = "none";
  document.getElementById("startScreen").style.display = "flex";
  document.getElementById("arjsScene").style.display = "none";
});

updateUI();
</script>

</body>
</html>
