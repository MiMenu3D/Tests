<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Test AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: sans-serif;
  width: 100vw;
  height: 100vh;
}

a-scene {
  position: fixed;
  inset: 0;
  background: transparent;
}

#startScreen {
  position: fixed;
  inset: 0;
  background: url("Loading screen.png") center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: 20%;
  z-index: 30;
}

#modelTitle {
  font-size: 22px;
  margin-bottom: 12px;
  text-shadow: 0 0 10px black;
  color: white;
}

.arrowContainer {
  display: flex;
  gap: 20px;
  margin-bottom: 10px;
}

.arrow {
  font-size: 28px;
  padding: 10px 16px;
  background: rgba(255,255,255,0.9);
  color: black;
  border-radius: 12px;
  border: none;
}

.button {
  background: white;
  color: black;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 16px;
  border: none;
  margin: 6px;
}
</style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: margot_targets.mind; autoStart: true; filterMinCF: 0.0002; filterBeta: 0.004;"
  renderer="alpha: true; physicallyCorrectLights: true; colorManagement: true; exposure: 3.5; toneMapping: ACESFilmicToneMapping;"
  color-space="sRGB"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

<a-assets>
  <a-asset-item id="hdrEnv" src="terrace_sea.hdr"></a-asset-item>
</a-assets>

<a-entity environment-map="src: #hdrEnv; intensity: 4.5"></a-entity>

<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

<a-entity mindar-image-target="targetIndex: 0">
  <a-gltf-model
    id="aframeModel"
    src="Plato_01.glb"
    rotation="90 0 0"
    scale="8 8 8">
  </a-gltf-model>
</a-entity>

</a-scene>

<div id="startScreen">
  <div id="modelTitle">Plato 01</div>

  <div class="arrowContainer">
    <button class="arrow" onclick="prev()">←</button>
    <button class="arrow" onclick="next()">→</button>
  </div>

  <button class="button" onclick="enterSceneViewer()">Scene Viewer</button>
  <button class="button" onclick="enterAFrame()">A-Frame</button>
  <button class="button" onclick="enterARjs()">AR.js</button>
</div>

<script>
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
let current = 0;
let arMode = false;

const models = Array.from({length: 15}, (_, i) => ({
  name: `Plato_${String(i+1).padStart(2,'0')}`,
  file: `Plato_${String(i+1).padStart(2,'0')}.glb`
}));

function activateARState() {
  if (!arMode) {
    history.replaceState({menu:true}, "");
    history.pushState({ar:true}, "");
    arMode = true;
  }
}

function updateUI(){
  document.getElementById("modelTitle").innerText = models[current].name;
  document.getElementById("aframeModel").setAttribute("src", models[current].file);
}

function prev(){
  current = (current - 1 + models.length) % models.length;
  updateUI();
}

function next(){
  current = (current + 1) % models.length;
  updateUI();
}

// Quick Look / Scene Viewer
function absoluteModelURL(file){
  return window.location.origin + window.location.pathname.replace(/[^/]*$/, '') + file;
}

function enterSceneViewer(){
  activateARState();
  if(isIOS){
    window.location.href = absoluteModelURL(models[current].file.replace(".glb",".usdz"));
  } else {
    const intent = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(absoluteModelURL(models[current].file))}&mode=ar_preferred&disable_occlusion=true#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(window.location.href)};end;`;
    window.location.href = intent;
  }
}

// A-Frame
function enterAFrame(){
  activateARState();
  document.getElementById("startScreen").style.display = "none";
  document.querySelector("a-scene").style.display = "block";
}

// AR.js
function enterARjs(){
  activateARState();
  document.getElementById("startScreen").style.display = "none";

  const scene = document.querySelector("a-scene");
  // Cambiamos MindAR por marcador AR.js
  scene.innerHTML = `
    <a-marker type="pattern" url="marker.patt">
      <a-gltf-model
        id="arjsModel"
        src="${models[current].file}"
        rotation="90 0 0"
        scale="8 8 8">
      </a-gltf-model>
    </a-marker>
    <a-entity camera></a-entity>
  `;
  scene.style.display = "block";
}

// Flechas del menú
updateUI();

// Volver atrás
window.addEventListener("popstate", function(){
  arMode = false;
  document.querySelector("a-scene").style.display = "none";
  document.getElementById("startScreen").style.display = "flex";
});

</script>

</body>
</html>
