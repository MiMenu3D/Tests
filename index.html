<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Test AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: sans-serif;
}

a-scene {
  position: fixed;
  inset: 0;
  background: transparent;
}

#arjsScene {
  position: fixed;
  inset: 0;
  display: none;
}

#mvContainer {
  position: fixed;
  inset: 0;
  background: #f2f2f2;
  display: none;
  z-index: 20;
}

model-viewer {
  width: 100%;
  height: 100%;
}

#startScreen {
  position: fixed;
  inset: 0;
  background: url("Loading screen.png") center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: 20%;
  z-index: 30;
}

#modelTitle {
  font-size: 22px;
  margin-bottom: 12px;
  color: white;
  text-shadow: 0 0 10px black;
}

.arrowContainer {
  display: flex;
  gap: 20px;
  margin-bottom: 10px;
}

.arrow {
  font-size: 28px;
  padding: 10px 16px;
  background: white;
  border-radius: 12px;
  border: none;
}

.button {
  background: white;
  padding: 14px 28px;
  border-radius: 30px;
  margin: 6px;
  border: none;
}
</style>
</head>

<body>

<!-- A-FRAME (MindAR) -->
<a-scene
  id="scene"
  mindar-image="imageTargetSrc: margot_targets.mind; autoStart: false;"
  renderer="alpha: true; physicallyCorrectLights: true; exposure: 3.5;"
>
  <a-assets>
    <a-asset-item id="hdrEnv" src="terrace_sea.hdr"></a-asset-item>
  </a-assets>

  <a-entity environment-map="src: #hdrEnv; intensity: 4.5"></a-entity>

  <a-camera look-controls="enabled:false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model id="aframeModel" src="Plato_01.glb" scale="8 8 8" rotation="90 0 0"></a-gltf-model>
  </a-entity>
</a-scene>

<!-- AR.JS -->
<a-scene id="arjsScene" embedded arjs>
  <a-marker type="pattern" url="marker.patt">
    <a-gltf-model id="arjsModel" src="Plato_01.glb" scale="0.5 0.5 0.5"></a-gltf-model>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<!-- MODEL VIEWER -->
<div id="mvContainer">
  <model-viewer id="mv" src="Plato_01.glb" ar ar-modes="scene-viewer" camera-controls></model-viewer>
</div>

<!-- MENU -->
<div id="startScreen">
  <div id="modelTitle">Plato 01</div>

  <div class="arrowContainer">
    <button class="arrow" onclick="prev()">←</button>
    <button class="arrow" onclick="next()">→</button>
  </div>

  <div id="androidButtons">
    <button class="button" onclick="enterSceneViewer()">Scene Viewer</button>
    <button class="button" onclick="enterAFrame()">A-Frame</button>
    <button class="button" onclick="enterModelViewer()">model-viewer</button>
    <button class="button" onclick="enterARJS()">AR.js</button>
  </div>

  <div id="iosButton" style="display:none;">
    <button class="button" onclick="enterQuickLook()">Ver en tu mesa</button>
  </div>
</div>

<script>

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

const models = Array.from({length:15}, (_,i)=>({
  name:`Plato ${String(i+1).padStart(2,"0")}`,
  file:`Plato_${String(i+1).padStart(2,"0")}.glb`
}));

let current = 0;

function absoluteModelURL(file){
  return location.origin + location.pathname.replace(/[^/]*$/, '') + file;
}

function updateUI(){
  modelTitle.innerText = models[current].name;
  aframeModel.setAttribute("src", models[current].file);
  mv.setAttribute("src", models[current].file);
  arjsModel.setAttribute("src", models[current].file);
}

function prev(){ current=(current-1+models.length)%models.length; updateUI(); }
function next(){ current=(current+1)%models.length; updateUI(); }

// ✅ FIX REAL A-FRAME
function enterAFrame(){
  startScreen.style.display="none";
  mvContainer.style.display="none";
  arjsScene.style.display="none";

  scene.style.display="block";
  scene.emit("start");
}

// MODEL VIEWER
function enterModelViewer(){
  startScreen.style.display="none";
  mvContainer.style.display="block";
}

// SCENE VIEWER
function enterSceneViewer(){
  const url = absoluteModelURL(models[current].file);
  location.href = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(url)}#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end;`;
}

// AR.JS
function enterARJS(){
  startScreen.style.display="none";
  scene.style.display="none";
  mvContainer.style.display="none";

  arjsScene.style.display="block";
}

// iOS
function enterQuickLook(){
  const usdz = models[current].file.replace(".glb",".usdz");
  location.href = absoluteModelURL(usdz);
}

if(isIOS){
  androidButtons.style.display="none";
  iosButton.style.display="block";
}

updateUI();

</script>

</body>
</html>
