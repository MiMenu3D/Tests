<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Test AR</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: sans-serif;
}

#mvContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 30%;
  background: #e8e3dc; /* gris cálido */
  display: block; /* siempre visible ahora */
  z-index: 40;
}

model-viewer {
  width: 100%;
  height: 100%;
  background: transparent;
}

#startScreen {
  position: fixed;
  inset: 0;
  background: url("Loading screen.png") center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: 20%;
  z-index: 30;
}

#modelTitle {
  font-size: 22px;
  margin-bottom: 12px;
  text-shadow: 0 0 10px black;
  color: white;
}

.arrowContainer {
  display: flex;
  gap: 20px;
  margin-bottom: 10px;
}

.arrow {
  font-size: 28px;
  padding: 10px 16px;
  background: rgba(255,255,255,0.9);
  color: black;
  border-radius: 12px;
  border: none;
}

.button {
  background: white;
  color: black;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 16px;
  border: none;
  margin: 6px;
}
</style>
</head>

<body>

<div id="startScreen">

  <div id="prueba" style="color:black;">Prueba 17</div>

  <div id="modelTitle">Plato 01</div>

  <div class="arrowContainer">
    <button class="arrow" onclick="prev()">←</button>
    <button class="arrow" onclick="next()">→</button>
  </div>

  <button class="button" onclick="enterSceneViewer()">Ver en tu mesa</button>

</div>

<div id="mvContainer">
<model-viewer
  id="mv"
  src="Plato_01.glb"
  autoplay
  auto-rotate
  rotation-per-second="20deg"
  camera-controls="false"
  touch-action="none"
  shadow-intensity="0"
  exposure="1"
  style="background-color:#e8e3dc;"
></model-viewer>
</div>

<script>

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

const models = [
  { name:"Plato 01", file:"Plato_01.glb" },
  { name:"Plato 02", file:"Plato_02.glb" },
  { name:"Plato 03", file:"Plato_03.glb" },
  { name:"Plato 04", file:"Plato_04.glb" },
  { name:"Plato 05", file:"Plato_05.glb" },
  { name:"Plato 06", file:"Plato_06.glb" },
  { name:"Plato 07", file:"Plato_07.glb" },
  { name:"Plato 08", file:"Plato_08.glb" },
  { name:"Plato 09", file:"Plato_09.glb" },
  { name:"Plato 10", file:"Plato_10.glb" },
  { name:"Plato 11", file:"Plato_11.glb" },
  { name:"Plato 12", file:"Plato_12.glb" },
  { name:"Plato 13", file:"Plato_13.glb" },
  { name:"Plato 14", file:"Plato_14.glb" },
  { name:"Plato 15", file:"Plato_15.glb" }
];

let current = 0;

function updateUI(){
  document.getElementById("modelTitle").innerText = models[current].name;
  document.getElementById("mv").setAttribute("src", models[current].file);
}

function prev(){
  current = (current - 1 + models.length) % models.length;
  updateUI();
}

function next(){
  current = (current + 1) % models.length;
  updateUI();

}

function enterSceneViewer(){

  const modelURL =
    location.origin + location.pathname.replace(/[^/]*$/, '') + models[current].file;

  if(isIOS){
    window.location.href = modelURL.replace(".glb",".usdz");
    return;
  }

  const intent =
    `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(modelURL)}&mode=ar_preferred&resizable=false&disable_occlusion=true#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end;`;

  window.location.href = intent;
}

updateUI();

const mv = document.getElementById("mv");

mv.addEventListener("load", () => {
  mv.cameraOrbit = "0deg 65deg 125%";
  mv.minCameraOrbit = "0deg 65deg 125%";
  mv.maxCameraOrbit = "0deg 65deg 125%";
});

</script>
 
</body>
</html>
