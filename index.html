<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Test AR</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: sans-serif;
}

#mvContainer {
  position: fixed;
  inset: 0;
  background: #f2f2f2;
  display: none;
  z-index: 20;
}

model-viewer {
  width: 100%;
  height: 100%;
  background: #f2f2f2;
}

#startScreen {
  position: fixed;
  inset: 0;
  background: url("Loading screen.png") center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: 20%;
  z-index: 30;
}

#modelTitle {
  font-size: 22px;
  margin-bottom: 12px;
  text-shadow: 0 0 10px black;
  color: white;
}

.arrowContainer {
  display: flex;
  gap: 20px;
  margin-bottom: 10px;
}

.arrow {
  font-size: 28px;
  padding: 10px 16px;
  background: rgba(255,255,255,0.9);
  color: black;
  border-radius: 12px;
  border: none;
}

.button {
  background: white;
  color: black;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 16px;
  border: none;
  margin: 6px;
}
</style>
</head>

<body>

<div id="arContainer"></div>

<div id="mvContainer">
  <model-viewer id="mv"
    src="Plato_01.glb"
    camera-controls
    shadow-intensity="0"
    exposure="1"
    occlusion="false">
  </model-viewer>
</div>

<div id="startScreen">
  <div id="modelTitle">Plato 01</div>

  <div class="arrowContainer">
    <button class="arrow" onclick="prev()">←</button>
    <button class="arrow" onclick="next()">→</button>
  </div>

  <button class="button" id="btnSceneViewer" onclick="enterSceneViewer()">Scene Viewer</button>
  <button class="button" id="btnAFrame" onclick="enterAFrame()">A-Frame</button>
  <button class="button" id="btnModelViewer" onclick="enterModelViewer()">model-viewer</button>
</div>

<script>

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

const models = [
  { name:"Plato 01", file:"Plato_01.glb" },
  { name:"Plato 02", file:"Plato_02.glb" },
  { name:"Plato 03", file:"Plato_03.glb" },
  { name:"Plato 04", file:"Plato_04.glb" },
  { name:"Plato 05", file:"Plato_05.glb" },
  { name:"Plato 06", file:"Plato_06.glb" },
  { name:"Plato 07", file:"Plato_07.glb" },
  { name:"Plato 08", file:"Plato_08.glb" },
  { name:"Plato 09", file:"Plato_09.glb" },
  { name:"Plato 10", file:"Plato_10.glb" },
  { name:"Plato 11", file:"Plato_11.glb" },
  { name:"Plato 12", file:"Plato_12.glb" },
  { name:"Plato 13", file:"Plato_13.glb" },
  { name:"Plato 14", file:"Plato_14.glb" },
  { name:"Plato 15", file:"Plato_15.glb" }
];

let current = 0;

function absoluteModelURL(file){
  return window.location.origin + window.location.pathname.replace(/[^/]*$/, '') + file;
}

function updateUI(){
  document.getElementById("modelTitle").innerText = models[current].name;
  document.getElementById("mv").setAttribute("src", models[current].file);
}

function prev(){ current = (current - 1 + models.length) % models.length; updateUI(); }
function next(){ current = (current + 1) % models.length; updateUI(); }

// 🔥 A-FRAME DINÁMICO
function enterAFrame(){

  document.getElementById("startScreen").style.display = "none";
  document.getElementById("mvContainer").style.display = "none";

  const container = document.getElementById("arContainer");

  container.innerHTML = `
  <a-scene
    mindar-image="imageTargetSrc: margot_targets.mind;"
    renderer="alpha:true; physicallyCorrectLights:true;"
    color-space="sRGB"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
  >
    <a-camera position="0 0 0"></a-camera>
    <a-entity mindar-image-target="targetIndex:0">
      <a-gltf-model src="${models[current].file}" rotation="90 0 0" scale="8 8 8"></a-gltf-model>
    </a-entity>
  </a-scene>
  `;

  // cargar scripts dinámicamente
  const s1 = document.createElement("script");
  s1.src = "https://aframe.io/releases/1.4.2/aframe.min.js";

  const s2 = document.createElement("script");
  s2.src = "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js";

  document.body.appendChild(s1);
  document.body.appendChild(s2);
}

function enterModelViewer(){
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("mvContainer").style.display = "block";
}

function enterSceneViewer(){

  if(isIOS){
    window.location.href = absoluteModelURL(models[current].file.replace('.glb','.usdz'));
    return;
  }

  const modelURL = absoluteModelURL(models[current].file);

  const intent =
  `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(modelURL)}&mode=ar_preferred#Intent;scheme=https;package=com.google.android.googlequicksearchbox;end;`;

  window.location.href = intent;
}

if(isIOS){
  document.getElementById("btnSceneViewer").innerText = "Ver en tu mesa";
  document.getElementById("btnAFrame").style.display = "none";
  document.getElementById("btnModelViewer").style.display = "none";
}

updateUI();

</script>

</body>
</html>
