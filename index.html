<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <!-- Ajuste para móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Test AR</title>

  <!-- Librerías -->
  <script src="https://aframe.io"></script>
  <script src="https://jsdelivr.net"></script>
  <script type="module" src="https://unpkg.com"></script>

  <!-- Estilos -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* Escena AR (A-Frame) */
    a-scene {
      position: fixed;
      inset: 0;
      background: transparent;
    }

    /* Contenedor de model-viewer */
    #mvContainer {
      position: fixed;
      inset: 0;
      background: #f2f2f2;
      display: none;
      z-index: 20;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #f2f2f2;
    }

    /* Pantalla inicial */
    #startScreen {
      position: fixed;
      inset: 0;
      background: url("Loading screen.png") center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 20%;
      z-index: 30;
    }

    /* Título del modelo */
    #modelTitle {
      font-size: 22px;
      margin-bottom: 12px;
      text-shadow: 0 0 10px black;
      color: white;
    }

    /* Flechas */
    .arrowContainer {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
    }

    .arrow {
      font-size: 28px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.9);
      color: black;
      border-radius: 12px;
      border: none;
    }

    /* Botones */
    .button {
      background: white;
      color: black;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 16px;
      border: none;
      margin: 6px;
    }
  </style>
</head>

<body>

  <!-- ========================= -->
  <!-- ESCENA A-FRAME (AR.js) -->
  <!-- ========================= -->

  <a-scene
    mindar-image="imageTargetSrc: margot_targets.mind; autoStart: true; filterMinCF: 0.0002; filterBeta: 0.004;"
    renderer="alpha: true; physicallyCorrectLights: true; colorManagement: true; exposure: 3.5; toneMapping: ACESFilmicToneMapping;"
    color-space="sRGB"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <!-- Assets -->
    <a-assets>
      <a-asset-item id="hdrEnv" src="terrace_sea.hdr"></a-asset-item>
    </a-assets>

    <!-- Cámara -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Modelo -->
    <a-gltf-model
      id="aframeModel"
      src="Plato_01.glb"
      rotation="90 0 0"
      scale="8 8 8">
    </a-gltf-model>

  </a-scene>


  <!-- ========================= -->
  <!-- MODEL VIEWER -->
  <!-- ========================= -->

  <div id="mvContainer">

    <!-- WebXR eliminado (solo AR nativo disponible) -->
    <model-viewer
      id="mv"
      src="Plato_01.glb"
      ar
      camera-controls
      shadow-intensity="0"
      exposure="1"
      occlusion="false">
    </model-viewer>

  </div>


  <!-- ========================= -->
  <!-- PANTALLA INICIAL -->
  <!-- ========================= -->

  <div id="startScreen">

    <div id="modelTitle">Plato 01</div>

    <!-- Flechas -->
    <div class="arrowContainer">
      <button class="arrow" onclick="prev()">←</button>
      <button class="arrow" onclick="next()">→</button>
    </div>

    <!-- Botones -->
    <button class="button" onclick="enterSceneViewer()">Scene Viewer</button>
    <button class="button" onclick="enterAFrame()">A-Frame</button>
    <button class="button" onclick="enterModelViewer()">model-viewer</button>

  </div>


  <!-- ========================= -->
  <!-- LÓGICA JS -->
  <!-- ========================= -->

  <script>

    // Modelos disponibles
    const models = [
      { name: "Plato 01", file: "Plato_01.glb" },
      { name: "Plato 02", file: "Plato_02.glb" }
    ];

    let current = 0;
    let arMode = false;

    // Activa estado AR en historial (para botón atrás)
    function activateARState() {
      if (!arMode) {
        history.replaceState({menu:true}, "");
        history.pushState({ar:true}, "");
        arMode = true;
      }
    }

    // Construye URL absoluta del modelo
    function absoluteModelURL(file){
      return window.location.origin +
             window.location.pathname.replace(/[^/]*$/, '') +
             file;
    }

    // Actualiza UI y modelos
    function updateUI(){
      document.getElementById("modelTitle").innerText = models[current].name;
      document.getElementById("aframeModel").setAttribute("src", models[current].file);
      document.getElementById("mv").setAttribute("src", models[current].file);
    }

    // Navegación
    function prev(){
      current = (current - 1 + models.length) % models.length;
      updateUI();
    }

    function next(){
      current = (current + 1) % models.length;
      updateUI();
    }

    // Entrar en A-Frame
    function enterAFrame(){
      activateARState();
      document.getElementById("startScreen").style.display = "none";
      document.getElementById("mvContainer").style.display = "none";
    }

    // Entrar en model-viewer
    function enterModelViewer(){
      activateARState();
      document.getElementById("startScreen").style.display = "none";
      document.getElementById("mvContainer").style.display = "block";
    }

    // Scene Viewer (Android)
    function enterSceneViewer(){
      activateARState();

      const modelURL = absoluteModelURL(models[current].file);
      const fallbackURL = window.location.href;

      const intent = `intent://://google.com{encodeURIComponent(modelURL)}&mode=ar_preferred&resizable=false&disable_occlusion=true#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(fallbackURL)};end;`;

      window.location.href = intent;
    }

    // Botón atrás del navegador
    window.addEventListener("popstate", function(){
      arMode = false;
      document.getElementById("mvContainer").style.display = "none";
      document.getElementById("startScreen").style.display = "flex";
    });

    // Inicializar
    updateUI();

  </script>

</body>
</html>
